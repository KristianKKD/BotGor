<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BotGor WebUI</title>
</head>
<body>
    <div id="content"></div>

    <script>
        const contentElement = document.getElementById("content");
        const defaultFontStack = '"Arial", "Segoe UI", sans-serif';
        const fontExistsCache = new Map();

        function normalizeFontName(fontName) {
            if (typeof fontName !== "string")
                return "";

            const cleaned = fontName.trim().replace(/["']/g, "");
            return cleaned;
        }

        function buildFontStack(fontName) {
            if (!fontName)
                return defaultFontStack;

            return `"${fontName}", ${defaultFontStack}`;
        }

        async function getSafeFontFamily(fontName) {
            const normalized = normalizeFontName(fontName);
            if (!normalized)
                return defaultFontStack;

            if (!document.fonts || typeof document.fonts.check !== "function")
                return buildFontStack(normalized);

            if (!fontExistsCache.has(normalized)) {
                const exists = document.fonts.check(`16px "${normalized}"`);
                fontExistsCache.set(normalized, exists);
            }

            return fontExistsCache.get(normalized) ? buildFontStack(normalized) : defaultFontStack;
        }

        async function refreshText() {
            try {
                const response = await fetch("/text/lines", {
                    cache: "no-store",
                });

                if (!response.ok)
                    return;

                const payload = await response.json();
                const lines = Array.isArray(payload.lines) ? payload.lines : [];

                contentElement.replaceChildren();
                for (const line of lines) {
                    const row = document.createElement("div");
                    row.className = "line";
                    row.textContent = line.text ?? "";
                    row.style.fontFamily = await getSafeFontFamily(line.font);
                    row.style.fontSize = `${Number(line.size) || 24}px`;
                    contentElement.appendChild(row);
                }
            } catch (_) {}
        }

        setInterval(refreshText, 250);
        refreshText();
    </script>
</body>
</html>
