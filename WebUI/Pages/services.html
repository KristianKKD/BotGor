<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BotGor - Service Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .service-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .service-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0,0,0,0.2);
        }

        .service-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .service-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
        }

        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .status-active {
            background: #10b981;
            color: white;
        }

        .status-inactive {
            background: #ef4444;
            color: white;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9em;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-start {
            background: #10b981;
            color: white;
        }

        .btn-start:hover:not(:disabled) {
            background: #059669;
        }

        .btn-stop {
            background: #ef4444;
            color: white;
        }

        .btn-stop:hover:not(:disabled) {
            background: #dc2626;
        }

        .btn-restart {
            background: #f59e0b;
            color: white;
        }

        .btn-restart:hover:not(:disabled) {
            background: #d97706;
        }

        .refresh-bar {
            background: white;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .refresh-bar button {
            flex: 0 0 auto;
            padding: 10px 20px;
            background: #667eea;
            color: white;
        }

        .refresh-bar button:hover {
            background: #5568d3;
        }

        .last-updated {
            color: #666;
            font-size: 0.9em;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
            padding: 40px;
        }

        .error {
            background: #fee2e2;
            border: 2px solid #ef4444;
            color: #991b1b;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 BotGor Service Manager</h1>
        
        <div id="error-container"></div>
        
        <div class="refresh-bar">
            <span class="last-updated">Last updated: <span id="last-updated">Never</span></span>
            <button onclick="refreshServices()">🔄 Refresh</button>
        </div>
        
        <br>
        
        <div id="services-container" class="loading">
            Loading services...
        </div>
    </div>

    <script>
        let services = {};
        let isProcessing = false;

        function formatTime(date) {
            return date.toLocaleTimeString();
        }

        function showError(message) {
            const errorContainer = document.getElementById('error-container');
            errorContainer.innerHTML = `<div class="error">⚠️ ${message}</div>`;
            setTimeout(() => {
                errorContainer.innerHTML = '';
            }, 5000);
        }

        async function serviceAction(serviceName, action) {
            if (isProcessing) return;
            isProcessing = true;

            try {
                const response = await fetch(`/services/${action}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ service: serviceName }),
                });

                if (!response.ok) {
                    throw new Error(`Failed to ${action} ${serviceName}`);
                }

                // Wait a moment for the service to change state
                setTimeout(refreshServices, 1000);
            } catch (error) {
                showError(error.message);
            } finally {
                isProcessing = false;
            }
        }

        function renderServices() {
            const container = document.getElementById('services-container');
            
            if (Object.keys(services).length === 0) {
                container.innerHTML = '<div class="loading">No services found</div>';
                return;
            }

            const grid = document.createElement('div');
            grid.className = 'services-grid';

            for (const [name, status] of Object.entries(services)) {
                const isActive = status === 'active';
                
                const card = document.createElement('div');
                card.className = 'service-card';
                
                card.innerHTML = `
                    <div class="service-header">
                        <div class="service-name">${name}</div>
                        <div class="status-badge ${isActive ? 'status-active' : 'status-inactive'}">
                            ${isActive ? '● Active' : '○ Inactive'}
                        </div>
                    </div>
                    <div class="button-group">
                        <button 
                            class="btn-start" 
                            onclick="serviceAction('${name}', 'start')"
                            ${isActive ? 'disabled' : ''}>
                            ▶ Start
                        </button>
                        <button 
                            class="btn-stop" 
                            onclick="serviceAction('${name}', 'stop')"
                            ${!isActive ? 'disabled' : ''}>
                            ■ Stop
                        </button>
                        <button 
                            class="btn-restart" 
                            onclick="serviceAction('${name}', 'restart')"
                            ${!isActive ? 'disabled' : ''}>
                            ↻ Restart
                        </button>
                    </div>
                `;
                
                grid.appendChild(card);
            }

            container.innerHTML = '';
            container.appendChild(grid);
            document.getElementById('last-updated').textContent = formatTime(new Date());
        }

        async function refreshServices() {
            try {
                const response = await fetch('/services/list', {
                    cache: 'no-store',
                });

                if (!response.ok) {
                    throw new Error('Failed to fetch services');
                }

                const data = await response.json();
                services = data.services || {};
                renderServices();
            } catch (error) {
                showError('Failed to load services: ' + error.message);
            }
        }

        // Auto-refresh every 3 seconds
        setInterval(refreshServices, 3000);
        
        // Initial load
        refreshServices();
    </script>
</body>
</html>
